name: Build & Test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The native tree-sitter modules build via node-gyp 9.x, whose gyp still
      # imports distutils. Python 3.12 removed distutils from the stdlib (and
      # runners now default to 3.13/3.14), so pin to 3.11 — the newest Python
      # that still ships distutils and that node-gyp 9 officially supports.
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: npm install
      - run: npm test

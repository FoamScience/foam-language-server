name: Build & Test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # node-gyp (bundled with npm 10 / Node 22) builds the native tree-sitter
      # modules using the runners' preinstalled python3 + toolchain; it no
      # longer needs distutils/setuptools, so no separate Python setup step.
      - run: npm install
      - run: npm test
